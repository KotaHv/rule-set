name: Build
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: rule-set-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Prepare previous rule sets
        run: |
          set -e -o pipefail

          git init deploy_temp
          git -C deploy_temp remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git -C deploy_temp config user.email "github-action@users.noreply.github.com"
          git -C deploy_temp config user.name "GitHub Action"

          if git -C deploy_temp ls-remote --exit-code --heads origin release >/dev/null; then
            git -C deploy_temp fetch --depth=1 origin release
            git -C deploy_temp checkout -B release FETCH_HEAD
            rsync -a --delete \
              --exclude='.git' \
              --exclude='*.html' \
              --exclude='icons/' \
              deploy_temp/ rule-set/
          else
            git -C deploy_temp checkout --orphan release
          fi
      - name: Restore legacy metadata
        uses: actions/cache/restore@v6
        with:
          path: .metadata.json
          key: rule-set-metadata-${{ github.run_id }}
          restore-keys: |
            rule-set-metadata-
      - name: Restore metadata
        uses: actions/cache/restore@v6
        with:
          path: .metadata.db
          key: rule-set-metadata-${{ github.run_id }}
          restore-keys: |
            rule-set-metadata-
      - name: Install sing-box
        run: |
          set -e -o pipefail
          bash <(curl -fsSL https://sing-box.app/install.sh)
      - name: Install mihomo
        run: |
          set -e -o pipefail

          sudo apt-get update && sudo apt-get install -y jq

          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64-v3") and endswith(".gz") and contains("go") == false) | .browser_download_url' | head -n1)
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Error: Could not find linux-amd64-v3.gz asset"
            exit 1
          fi

          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o mihomo.gz "$DOWNLOAD_URL"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

          # Verify installation
          mihomo -v
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - run: |
          set -e -o pipefail
          uv sync
          uv run rule-set
      - name: Deploy to release branch
        run: |
          set -e -o pipefail

          cd deploy_temp
          rsync -rvc --delete --exclude='.git' ../rule-set/ .

          # Generate GitHub Pages navigation
          echo "Generating pages in deploy_temp directory..."
          test -f ../.metadata.db
          uv run gen-pages --target-path .

          if [[ -z $(git status --porcelain) ]]; then
              echo "No changes to commit."
          else
              git add .
              git commit -m "Update release (${GITHUB_SHA})"
              git push origin release
          fi
      - name: Save metadata
        uses: actions/cache/save@v6
        with:
          path: .metadata.db
          key: rule-set-metadata-${{ github.run_id }}
