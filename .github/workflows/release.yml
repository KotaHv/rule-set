name: Build
on:
  push:
    branches:
      - master
  schedule:
    - cron: "27 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: rule-set-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest

  test-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Run tests
        run: bun run test

  build:
    needs: [test, test-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Prepare previous rule sets
        run: |
          set -e -o pipefail

          git init deploy_temp
          git -C deploy_temp remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git -C deploy_temp config user.email "github-action@users.noreply.github.com"
          git -C deploy_temp config user.name "GitHub Action"

          if git -C deploy_temp ls-remote --exit-code --heads origin release >/dev/null; then
            git -C deploy_temp fetch --depth=1 origin release
            git -C deploy_temp checkout -B release FETCH_HEAD
            rsync -a --delete \
              --exclude='.git' \
              --exclude='*.html' \
              --exclude='icons/' \
              --exclude='assets/' \
              --exclude='manifest.json' \
              --exclude='.nojekyll' \
              deploy_temp/ rule-set/
          else
            git -C deploy_temp checkout --orphan release
          fi
      - name: Restore metadata
        uses: actions/cache/restore@v6
        with:
          path: .metadata.db
          key: rule-set-metadata-${{ github.run_id }}
          restore-keys: |
            rule-set-metadata-
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync
      - name: Build rule sets
        env:
          LOG_LEVEL: ${{ runner.debug == '1' && 'DEBUG' || 'WARNING' }}
        run: uv run rule-set
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Deploy to release branch
        run: |
          set -e -o pipefail

          cd deploy_temp
          rsync -rvc --delete --exclude='.git' ../rule-set/ .
          rsync -a ../web/dist/ .

          if [[ -z $(git status --porcelain) ]]; then
              echo "No changes to commit."
          else
              git add .
              git commit -m "Update release (${GITHUB_SHA})"
              git push origin release
          fi
      - name: Save metadata
        uses: actions/cache/save@v6
        with:
          path: .metadata.db
          key: rule-set-metadata-${{ github.run_id }}
