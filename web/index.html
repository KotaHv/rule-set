<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%logo.webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KotaHv 规则集" />
    <link
      rel="preload"
      as="fetch"
      href="%BASE_URL%manifest.json"
      crossorigin
    />
    <title>Rule Set - 规则集</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #fafaf9;
      }

      .boot-screen {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 2rem;
        padding: 1.5rem;
        background: #fafaf9;
      }

      /*
       * Set by RootLayout after React has painted real content, so the overlay
       * only ever fades out over an opaque page.
       */
      html[data-app-ready] .boot-screen {
        animation: boot-out 600ms ease-out forwards;
      }

      @keyframes boot-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      .boot-logo {
        display: block;
        width: 96px;
        height: 96px;
        opacity: 0;
        transition: opacity 600ms ease-out;
        user-select: none;
        -webkit-user-drag: none;
      }

      .boot-logo.is-loaded {
        opacity: 1;
      }

      .boot-track {
        position: relative;
        width: 96px;
        height: 1px;
        overflow: hidden;
        background: #e7e5e4;
      }

      .boot-track::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: #44403c;
        animation: boot-sweep 1.6s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }

      .boot-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-logo {
          transition: none;
        }

        .boot-track::after {
          animation: none;
          transform: none;
        }

        html[data-app-ready] .boot-screen {
          animation: none;
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-screen" role="status" aria-live="polite">
      <img
        class="boot-logo"
        src="%BASE_URL%logo.webp"
        alt=""
        width="96"
        height="96"
        draggable="false"
      />
      <div class="boot-track" aria-hidden="true"></div>
      <span class="boot-sr-only">正在加载规则列表</span>
    </div>
    <script>
      (() => {
        const logo = document.querySelector(".boot-logo");

        if (!logo) {
          return;
        }

        const reveal = () => logo.classList.add("is-loaded");

        if (logo.complete && logo.naturalWidth > 0) {
          reveal();
        } else {
          logo.addEventListener("load", reveal, { once: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
