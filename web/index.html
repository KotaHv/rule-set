<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%logo.webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KotaHv 规则集" />
    <link
      rel="preload"
      as="fetch"
      href="%BASE_URL%manifest.json"
      crossorigin
    />
    <title>Rule Set - 规则集</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #fafaf9;
      }

      .boot-screen {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        height: 100vh;
        height: 100dvh;
        place-items: center;
        padding: 1.5rem;
        background: #fafaf9;
      }

      /*
       * Set by AppFrame after React has painted real content, so the overlay
       * only ever fades out over an opaque page.
       */
      html[data-app-ready] .boot-screen {
        animation: boot-out 180ms ease-out forwards;
      }

      @keyframes boot-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      .boot-mark {
        position: relative;
        width: 96px;
        height: 96px;
      }

      .boot-logo {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 12px 28px rgba(28, 25, 23, 0.12));
        user-select: none;
        -webkit-user-drag: none;
      }

      .boot-ring {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        fill: none;
        pointer-events: none;
      }

      .boot-ring-arc {
        stroke: rgba(68, 64, 60, 0.82);
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-dasharray: 18 82;
        vector-effect: non-scaling-stroke;
        opacity: 0;
        animation: boot-ring 2.4s linear infinite;
        animation-play-state: paused;
        transition: opacity 220ms ease-out;
      }

      .boot-mark.boot-ready .boot-ring-arc {
        opacity: 1;
        animation-play-state: running;
      }

      .boot-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      @media (min-width: 640px) {
        .boot-mark {
          width: 128px;
          height: 128px;
        }
      }

      @keyframes boot-ring {
        to {
          stroke-dashoffset: -100;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-ring-arc {
          animation: none;
          display: none;
        }

        html[data-app-ready] .boot-screen {
          animation: none;
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark">
        <svg class="boot-ring" viewBox="0 0 128 128" aria-hidden="true">
          <rect
            class="boot-ring-arc"
            x="7.5"
            y="7.5"
            width="113"
            height="113"
            rx="25.25"
            pathLength="100"
          />
        </svg>
        <img
          class="boot-logo"
          src="%BASE_URL%logo.webp"
          alt=""
          width="96"
          height="96"
          draggable="false"
        />
      </div>
      <span class="boot-sr-only">正在加载规则列表</span>
    </div>
    <script>
      (() => {
        const mark = document.querySelector(".boot-mark");
        const logo = mark && mark.querySelector(".boot-logo");

        if (!mark || !logo) {
          return;
        }

        const reveal = () => mark.classList.add("boot-ready");

        if (logo.complete && logo.naturalWidth > 0) {
          reveal();
        } else {
          logo.addEventListener("load", reveal, { once: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
