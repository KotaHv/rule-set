<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" type="image/png" href="/rule-set/favicon.png" />
    <link
      rel="preload"
      as="image"
      href="/rule-set/logo.webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KotaHv 规则集" />
    <link
      rel="preload"
      as="fetch"
      href="/rule-set/manifest.json"
      crossorigin
    />
    <title>Rule Set - 规则集</title>
    <style>html,body,#root{min-height:100%}body{background:#0c0a09;margin:0}html{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}.boot-screen{box-sizing:border-box;z-index:50;background:#0c0a09;place-content:center;justify-items:center;gap:2rem;padding:1.5rem;display:grid;position:fixed;inset:0}html[data-app-ready] .boot-screen{animation:.6s ease-out forwards boot-out}@keyframes boot-out{to{opacity:0;visibility:hidden}}.boot-logo{opacity:0;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;width:96px;height:96px;transition:opacity .6s ease-out;display:block}.boot-logo.is-loaded{opacity:1}.boot-track{background:#292524;width:96px;height:1px;position:relative;overflow:hidden}.boot-track:after{content:"";background:#fafaf9;width:40%;animation:1.6s ease-in-out infinite boot-sweep;position:absolute;inset:0}@keyframes boot-sweep{0%{transform:translate(-100%)}to{transform:translate(250%)}}.boot-sr-only{clip:rect(0, 0, 0, 0);clip-path:inset(50%);white-space:nowrap;border:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}@media (prefers-reduced-motion:reduce){.boot-logo{transition:none}.boot-track:after{animation:none;transform:none}html[data-app-ready] .boot-screen{opacity:0;visibility:hidden;animation:none}}</style>
    <script type="module" crossorigin src="/rule-set/assets/index-Da4EocYV.js"></script>
    <link rel="stylesheet" crossorigin href="/rule-set/assets/index-BmWsmZtE.css">
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-screen" role="status" aria-live="polite">
      <img
        class="boot-logo"
        src="/rule-set/logo.webp"
        alt=""
        width="96"
        height="96"
        draggable="false"
      />
      <div class="boot-track" aria-hidden="true"></div>
      <span class="boot-sr-only">正在加载规则列表</span>
    </div>
    <script>
      (() => {
        const logo = document.querySelector(".boot-logo");

        if (!logo) {
          return;
        }

        const reveal = () => logo.classList.add("is-loaded");

        if (logo.complete && logo.naturalWidth > 0) {
          reveal();
        } else {
          logo.addEventListener("load", reveal, { once: true });
        }
      })();
    </script>
  </body>
</html>
