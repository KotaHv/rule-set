<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/rule-set/favicon.png" />
    <link
      rel="preload"
      as="image"
      href="/rule-set/logo.webp"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KotaHv 规则集" />
    <link
      rel="preload"
      as="fetch"
      href="/rule-set/manifest.json"
      crossorigin
    />
    <title>Rule Set - 规则集</title>
    <style>html,body,#root{min-height:100%}body{background:#fafaf9;margin:0}.boot-screen{box-sizing:border-box;z-index:50;background:#fafaf9;place-items:center;height:100dvh;padding:1.5rem;display:grid;position:fixed;inset:0}html[data-app-ready] .boot-screen{animation:.52s ease-out forwards boot-out}@keyframes boot-out{to{opacity:0;visibility:hidden}}.boot-mark{width:96px;height:96px;position:relative}.boot-logo{z-index:1;filter:drop-shadow(0 12px 28px #1c19171f);-webkit-user-select:none;user-select:none;-webkit-user-drag:none;width:100%;height:100%;display:block;position:relative}.boot-ring{z-index:2;fill:none;pointer-events:none;width:100%;height:100%;position:absolute;inset:0;overflow:visible}.boot-ring-arc{stroke:#44403cd1;stroke-width:1.75px;stroke-linecap:round;stroke-dasharray:18 82;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .22s ease-out;animation:2.4s linear infinite paused boot-ring}.boot-mark.boot-ready .boot-ring-arc{opacity:1;animation-play-state:running}.boot-sr-only{clip:rect(0, 0, 0, 0);clip-path:inset(50%);white-space:nowrap;border:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}@media (width>=640px){.boot-mark{width:128px;height:128px}}@keyframes boot-ring{to{stroke-dashoffset:-100px}}@media (prefers-reduced-motion:reduce){.boot-ring-arc{animation:none;display:none}html[data-app-ready] .boot-screen{opacity:0;visibility:hidden;animation:none}}</style>
    <script type="module" crossorigin src="/rule-set/assets/index-Cqj1SFT8.js"></script>
    <link rel="stylesheet" crossorigin href="/rule-set/assets/index-CJIGY4Cz.css">
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-screen" role="status" aria-live="polite">
      <div class="boot-mark">
        <svg class="boot-ring" viewBox="0 0 128 128" aria-hidden="true">
          <rect
            class="boot-ring-arc"
            x="7.5"
            y="7.5"
            width="113"
            height="113"
            rx="25.25"
            pathLength="100"
          />
        </svg>
        <img
          class="boot-logo"
          src="/rule-set/logo.webp"
          alt=""
          width="96"
          height="96"
          draggable="false"
        />
      </div>
      <span class="boot-sr-only">正在加载规则列表</span>
    </div>
    <script>
      (() => {
        const mark = document.querySelector(".boot-mark");
        const logo = mark && mark.querySelector(".boot-logo");

        if (!mark || !logo) {
          return;
        }

        const reveal = () => mark.classList.add("boot-ready");

        if (logo.complete && logo.naturalWidth > 0) {
          reveal();
        } else {
          logo.addEventListener("load", reveal, { once: true });
        }
      })();
    </script>
  </body>
</html>
