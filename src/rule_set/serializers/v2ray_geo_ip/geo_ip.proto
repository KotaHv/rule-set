// Regenerate from the repository root with protoc 36.2:
//   protoc --python_out=src/rule_set/serializers/v2ray_geo_ip \
//     --pyi_out=src/rule_set/serializers/v2ray_geo_ip \
//     --proto_path=src/rule_set/serializers/v2ray_geo_ip \
//     src/rule_set/serializers/v2ray_geo_ip/geo_ip.proto

syntax = "proto3";
// IP for routing decision, in CIDR form.
message CIDR {
  // IP address, should be either 4 or 16 bytes.
  bytes ip = 1;

  // Number of leading ones in the network mask.
  uint32 prefix = 2;
}

message GeoIP {
  string country_code = 1;
  repeated CIDR cidr = 2;
  bool inverse_match = 3;
}

message GeoIPList { repeated GeoIP entry = 1; }